kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: chaos-demo
nodes:
  # Control plane doubles as the ingress node.
  # Host ports 8080/8443 are mapped so you can reach the demo from Windows
  # (WSL2 forwards localhost automatically).
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
  # Three workers so pod spreading and "which node died" are visible in the demo.
  - role: worker
  - role: worker
  - role: worker
